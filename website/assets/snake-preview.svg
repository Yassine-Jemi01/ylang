<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Snake game preview</title>
  <desc id="desc">A small dark game window with a grid, a teal snake, an orange apple, and a score display.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#29474a" stroke-width="1"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163638"/><stop offset="1" stop-color="#0d2428"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102d30" flood-opacity=".2"/></filter>
  </defs>
  <rect x="28" y="20" width="664" height="460" rx="18" fill="#dce6df" opacity=".65"/>
  <g filter="url(#shadow)">
    <rect x="52" y="40" width="616" height="420" rx="14" fill="url(#bg)" stroke="#426064" stroke-width="1.5"/>
    <path d="M66 40h588a14 14 0 0 1 14 14v44H52V54a14 14 0 0 1 14-14Z" fill="#1c4143"/>
    <circle cx="76" cy="68" r="5" fill="#e8a06b"/><circle cx="94" cy="68" r="5" fill="#e3c57c"/><circle cx="112" cy="68" r="5" fill="#78c3a6"/>
    <text x="360" y="73" text-anchor="middle" fill="#d8e8df" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">SNAKE</text>
    <text x="82" y="125" fill="#8fb7ad" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">SCORE</text>
    <text x="82" y="153" fill="#f4c18d" font-family="ui-monospace, monospace" font-size="25" font-weight="700">120</text>
    <text x="588" y="125" text-anchor="end" fill="#8fb7ad" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">BEST</text>
    <text x="588" y="153" text-anchor="end" fill="#d8e8df" font-family="ui-monospace, monospace" font-size="25" font-weight="700">240</text>
    <rect x="82" y="174" width="556" height="244" rx="5" fill="#102a2d" stroke="#2b5050"/>
    <rect x="82" y="174" width="556" height="244" rx="5" fill="url(#grid)"/>
    <g fill="#5bc7ad">
      <rect x="222" y="314" width="28" height="28" rx="5"/>
      <rect x="250" y="314" width="28" height="28" rx="5"/>
      <rect x="278" y="314" width="28" height="28" rx="5"/>
      <rect x="306" y="314" width="28" height="28" rx="5"/>
      <rect x="334" y="314" width="28" height="28" rx="5"/>
      <rect x="334" y="286" width="28" height="28" rx="5"/>
      <rect x="334" y="258" width="28" height="28" rx="5"/>
    </g>
    <rect x="336" y="260" width="24" height="24" rx="4" fill="#8be2c9"/>
    <circle cx="345" cy="268" r="2.2" fill="#102d30"/><circle cx="353" cy="268" r="2.2" fill="#102d30"/>
    <g transform="translate(474 258)">
      <path d="M0 7C-13-6-26 5-21 17c3 9 13 17 21 22 8-5 18-13 21-22C26 5 13-6 0 7Z" fill="#f1a06b"/>
      <path d="M0 7C0-1 5-7 12-8" fill="none" stroke="#9acb8b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M82 436H638" stroke="#2b5050"/>
    <text x="82" y="449" fill="#8fb7ad" font-family="ui-monospace, monospace" font-size="10">ARROW KEYS TO MOVE</text>
    <text x="638" y="449" text-anchor="end" fill="#8fb7ad" font-family="ui-monospace, monospace" font-size="10">BUILT WITH YLANG</text>
  </g>
</svg>