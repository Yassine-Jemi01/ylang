[book]
title = "كتاب YLang"
authors = ["YLang contributors"]
language = "ar"
text-direction = "rtl"
src = "src/ar"
description = "المسار التعليمي العربي للغة YLang."

[build]
build-dir = "book-ar"
create-missing = false

[output.html]
favicon = "ylang-mark.svg"
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/Yassine-Jemi01/ylang"
additional-css = ["theme/ylang-book.css"]
additional-js = ["theme/ylang-nav.js"]

[output.html.search]
enable = true
limit-results = 30

[output.html.fold]
enable = true
level = 1
