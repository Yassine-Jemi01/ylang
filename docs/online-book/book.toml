[book]
title = "The YLang Book"
authors = ["YLang contributors"]
language = "en"
text-direction = "ltr"
src = "src"
description = "Learn YLang from your first program to its compiler, libraries, and platform guides."

[build]
build-dir = "book"
create-missing = false

[output.html]
theme = "theme"
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/Yassine-Jemi01/ylang"
site-url = "/ylang/learn/"
additional-css = ["theme/ylang-book.css"]
additional-js = ["theme/ylang-nav.js"]

[output.html.search]
enable = true
limit-results = 30

[output.html.fold]
enable = true
level = 1
