name: Archive repository traffic

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ylang-traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test traffic archive logic
        run: python3 tools/traffic/test_collect.py

      - name: Collect GitHub traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/traffic/collect.py

      - name: Commit updated traffic archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/traffic/data.json
          if git diff --cached --quiet; then
            echo "Traffic archive is unchanged."
          else
            git commit -m "chore: archive repository traffic"
            git push
          fi
