name: ylpm

on:
  push:
    paths:
      - "tools/ylpm/**"
      - ".github/workflows/ylpm.yml"
  pull_request:
    paths:
      - "tools/ylpm/**"
      - ".github/workflows/ylpm.yml"
  workflow_dispatch:

jobs:
  test:
    name: Go package manager
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/ylpm
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: tools/ylpm/go.mod
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run unit tests
        run: go test ./...
      - name: Run static analysis
        run: go vet ./...
      - name: Build ylpm
        run: go build ./...
      - name: Smoke-test CLI
        run: |
          go run . version
          go run . --help
