name: YLang 3.0 IR verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/ir.c"
      - "src/ir_opt.c"
      - "src/ir_json.c"
      - "src/ir_lower.c"
      - "src/parser.c"
      - "src/sema.c"
      - "src/lexer.c"
      - "include/ylang/ir.h"
      - "tests/ir_unit.c"
      - "tests/ir_backend_parity.py"
      - "tests/run.sh"
      - "tests/ir_opt_unit.c"
      - "tests/ir_json_unit.c"
      - "tests/check_ir_json.py"
      - "Makefile"
      - "tests/ir_lower_unit.c"
      - "tests/run-ir-unit.sh"
      - ".github/workflows/ir-verifier.yml"

concurrency:
  group: ylang-3-ir-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ir-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier and lowering tests with strict warnings
        run: sh tests/run-ir-unit.sh
