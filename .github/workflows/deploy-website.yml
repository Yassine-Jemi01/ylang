name: Deploy YLang website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tools/build_docs_book.py"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - name: Build the online HTML book
        run: |
          python3 tools/build_docs_book.py
          mdbook build docs/online-book
          mkdir -p website/learn
          cp -a docs/online-book/book/. website/learn/
      - name: Add the versioned PDF edition
        run: cp docs/book/YLang-Book.pdf website/YLang-Book.pdf
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
