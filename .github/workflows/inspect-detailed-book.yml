name: Inspect detailed book PDF

on:
  push:
    branches: ['docs/rewrite-detailed-book']
    paths:
      - 'docs/book/YLang-Book.pdf'
      - '.github/workflows/inspect-detailed-book.yml'

permissions:
  contents: read

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rewrite-detailed-book
      - uses: actions/upload-artifact@v4
        with:
          name: detailed-ylang-book-pdf
          path: docs/book/YLang-Book.pdf
          if-no-files-found: error
          retention-days: 2
