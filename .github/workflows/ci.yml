name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Build compiler
        run: make clean all CC=${{ matrix.compiler }}
      - name: Run regression tests
        run: make test CC=${{ matrix.compiler }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            diffutils
            grep
            sed
      - name: Build compiler for Windows
        run: make clean all CC=gcc
      - name: Run Windows regression tests
        run: make test CC=gcc
      - name: Build from native PowerShell
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./scripts/windows/build.ps1 -Compiler gcc
          ./scripts/windows/smoke-test.ps1
      - name: Build Neovim Tree-sitter parser DLL
        run: gcc -std=c11 -O2 -shared -static-libgcc -Itree-sitter-ylang/src tree-sitter-ylang/src/parser.c -o build/ylang.dll
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/windows/build.ps1",
            "scripts/windows/smoke-test.ps1",
            "editors/neovim/install.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }

  language-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install language server dependencies
        run: npm install
        working-directory: editors/vscode
      - name: Check extension and language server syntax
        run: npm run check
        working-directory: editors/vscode
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package
        working-directory: editors/vscode

  tree-sitter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tree-sitter CLI
        run: npm install
        working-directory: tree-sitter-ylang
      - name: Generate parser
        run: npm run generate
        working-directory: tree-sitter-ylang
      - name: Run grammar corpus tests
        run: npm test
        working-directory: tree-sitter-ylang
      - name: Parse grammar examples
        run: npm run parse:examples
        working-directory: tree-sitter-ylang
