name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # Apple's gcc command is a Clang alias; test it once as clang.
          - os: macos-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-rt-dev nasm gdb ffmpeg libsdl2-dev libsdl2-mixer-dev libcurl4-openssl-dev pkg-config
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select --install 2>/dev/null || true
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list make >/dev/null 2>&1 || brew install make
          brew list sdl2 >/dev/null 2>&1 || brew install sdl2
          brew list sdl2_mixer >/dev/null 2>&1 || brew install sdl2_mixer
          brew list curl >/dev/null 2>&1 || brew install curl
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Select compiler
        id: compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" && "$RUNNER_OS" == "macOS" ]]; then
            echo "cc=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_OUTPUT"
            echo "make=gmake" >> "$GITHUB_OUTPUT"
          else
            echo "cc=${{ matrix.compiler }}" >> "$GITHUB_OUTPUT"
            echo "make=make" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify generated C runtime template
        run: make check-runtime-template
      - name: Build compiler
        run: ${{ steps.compiler.outputs.make }} clean all CC="${{ steps.compiler.outputs.cc }}"
      - name: Build optional GUI runtime
        run: ${{ steps.compiler.outputs.make }} gui gui-example game2d-example CC="${{ steps.compiler.outputs.cc }}"
      - name: Build responsive TUI example
        run: ${{ steps.compiler.outputs.make }} tui-example CC="${{ steps.compiler.outputs.cc }}"
      - name: Build optional Voice runtime and YLang example
        run: ${{ steps.compiler.outputs.make }} voice voice-example voice-test CC="${{ steps.compiler.outputs.cc }}"
      - name: Verify optional runtime flags across imported modules
        run: |
          ./build/ylang check tests/optional-feature-imports/main.yl
          ./build/ylang build tests/optional-feature-imports/main.yl -o build/optional-feature-imports
      - name: Run regression tests
        run: ${{ steps.compiler.outputs.make }} test CC="${{ steps.compiler.outputs.cc }}"
      - name: Record native benchmark against stable baseline
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: python3 benchmarks/compare-release.py --baseline v2.2.0 --cc gcc --runs 30 --warmup 3
      - name: Upload reproducible benchmark comparison
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: ylang-2.3-benchmark
          path: build/release-benchmark/
          if-no-files-found: error
      - name: Fuzz lexer/parser smoke test
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: make fuzz-smoke FUZZ_CC=clang
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: ${{ steps.compiler.outputs.make }} sanitize CC="${{ steps.compiler.outputs.cc }}"

  windows-native-smoke:
    name: Windows native compiler smoke tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkgconf
            make
            python
      - name: Verify generated runtime template
        run: make check-runtime-template PYTHON=python
      - name: Build compiler
        run: make clean all CC=gcc PYTHON=python
      - name: Verify compiler diagnostics remain English
        run: python tests/check_english_diagnostics.py
      - name: Verify unused optional runtime sections are excluded
        run: python tests/check_runtime_feature_gates.py --cc gcc
      - name: Build optional SDL2 GUI runtime
        run: make gui gui-example game2d-example CC=gcc PYTHON=python
      - name: Build optional SDL2_mixer Voice runtime
        run: make voice CC=gcc PYTHON=python
      - name: Verify optional runtime flags across imported modules
        run: |
          mkdir -p build/windows-smoke
          ./build/ylang.exe check tests/optional-feature-imports/main.yl
          ./build/ylang.exe build tests/optional-feature-imports/main.yl -o build/windows-smoke/optional-feature-imports.exe
      - name: Verify YLanglings CLI, install lifecycle, and full curriculum
        run: make ylanglings-test ylanglings-verify PYTHON=python
      - name: Check, compile, and run a native Windows program
        run: |
          mkdir -p build/windows-smoke
          cat > build/windows-smoke/hello.yl <<'EOF'
          function main() -> int {
              print("Windows smoke:", 40 + 2);
              return 0;
          }
          EOF
          ./build/ylang.exe check build/windows-smoke/hello.yl
          ./build/ylang.exe build build/windows-smoke/hello.yl -o build/windows-smoke/hello.exe
          output="$(./build/windows-smoke/hello.exe)"
          test "$output" = "Windows smoke: 42"
      - name: Check multi-file imports with Windows paths
        run: |
          mkdir -p build/windows-imports
          cat > build/windows-imports/math.yl <<'EOF'
          function answer() -> int {
              return 42;
          }
          EOF
          cat > build/windows-imports/main.yl <<'EOF'
          from "./math.yl" import answer;
          function main() -> int {
              print(answer());
              return 0;
          }
          EOF
          ./build/ylang.exe build build/windows-imports/main.yl -o build/windows-imports/main.exe
          output="$(./build/windows-imports/main.exe)"
          test "$output" = "42"
      - name: Check portable standard input runtime
        run: |
          cat > build/windows-smoke/input.yl <<'EOF'
          function main() -> int {
              print(io.read_line());
              return 0;
          }
          EOF
          ./build/ylang.exe build build/windows-smoke/input.yl -o build/windows-smoke/input.exe
          output="$(printf 'native Windows input\n' | ./build/windows-smoke/input.exe)"
          test "$output" = "native Windows input"
      - name: Test native Windows HTTP, async tasks, and redirect safety
        run: |
          export YLANG_TEST_API_KEY=test-token
          python tests/run_http_integration.py
      - name: Compile TUI builtins for native Windows
        run: |
          ./build/ylang check tests/tui-builtins.yl
          ./build/ylang build tests/tui-builtins.yl -o build/windows-smoke/tui-builtins.exe
      - name: Exercise interactive Windows TUI input and console restoration
        run: |
          cat > build/windows-smoke/tui-interactive.yl <<'EOF'
          function main() -> int {
              print("BOOT");
              let string gate = io.read_line();
              if (gate != "go") { return 9; }
              if (!tui.init()) { return 10; }
              if (!tui.clear()) { tui.shutdown(); return 11; }
              if (!tui.set_cursor(1, 1)) { tui.shutdown(); return 12; }
              if (!tui.hide_cursor()) { tui.shutdown(); return 13; }
              if (!tui.write("READY")) { tui.shutdown(); return 14; }
              let int key = tui.read_key();
              tui.shutdown();
              if (key != 120) { return 15; }
              return 0;
          }
          EOF
          ./build/ylang.exe check build/windows-smoke/tui-interactive.yl
          ./build/ylang.exe build build/windows-smoke/tui-interactive.yl -o build/windows-smoke/tui-interactive.exe
          gcc tests/tui_windows_console_test.c -o build/windows-smoke/tui-windows-console-test.exe
          ./build/windows-smoke/tui-windows-console-test.exe ./build/windows-smoke/tui-interactive.exe
      - name: Reject unsupported Windows interactive debugger cleanly
        run: |
          if ./build/ylang.exe debug tests/debug-source-map.yl -o build/windows-smoke/debug-unsupported.exe > build/windows-smoke/debug.out 2>&1; then
            echo "FAIL: Windows interactive debugger unexpectedly claimed support" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 64
          fi
          grep -q "interactive debugging is not implemented on Windows" build/windows-smoke/debug.out
          test ! -e build/windows-smoke/debug-unsupported.exe

  yspm-package-smoke:
    name: Build and inspect YLang .yspkg package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install C build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils
      - name: Set up Go for YSPM
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Check out YSPM package builder
        uses: actions/checkout@v4
        with:
          repository: Yassine-Jemi01/yspm
          ref: ba2c2c31b864ca85333fa625b437b3c6b9452e96
          path: tools/yspm-source
      - name: Build YSPM
        working-directory: tools/yspm-source
        run: |
          mkdir -p build
          go build -o build/yspm ./cmd/yspm
      - name: Build YLang native package
        run: YSPM_BIN="$GITHUB_WORKSPACE/tools/yspm-source/build/yspm" bash packaging/yspm/build-package.sh
      - name: Inspect package structure and compiler
        run: |
          package_path="$(find build/ylang-yspm -name '*.yspkg' -type f -print -quit)"
          test -n "$package_path"
          tar -tzf "$package_path" > build/ylang-yspm/package-files.txt
          for expected in \
            "metadata.json" \
            "root/usr/bin/ylang" \
            "root/usr/share/ylang/stdlib/game2d.yl" \
            "root/usr/share/doc/ylang/CHANGELOG.md" \
            "root/usr/share/doc/ylang/CHANGELOG-2.1.0.md" \
            "root/usr/share/doc/ylang/CHANGELOG-2.2.0.md" \
            "root/usr/share/doc/ylang/CHANGELOG-2.3.0.md" \
            "root/usr/share/doc/ylang/ROADMAP-2.3.0.md" \
            "root/usr/share/doc/ylang/RELEASE-CHECKLIST-2.3.0.md" \
            "root/usr/share/doc/ylang/POST-RELEASE-CHECKLIST-2.3.0.md" \
            "root/usr/share/doc/ylang/JSON.md" \
            "root/usr/share/doc/ylang/HTTP-STREAMING.md" \
            "root/usr/share/doc/ylang/CLI.md" \
            "root/usr/share/doc/ylang/error-codes.md" \
            "root/usr/share/doc/ylang/ACCEPTANCE-2.2.0.md" \
            "root/usr/share/doc/ylang/MEMORY-MODEL.md" \
            "root/usr/share/doc/ylang/HTTP.md" \
            "root/usr/share/doc/ylang/DEBUGGER.md" \
            "root/usr/share/doc/ylang/DEBUGGER-SPEC.md" \
            "root/usr/share/doc/ylang/ROADMAP-2.2.0.md" \
            "root/usr/share/doc/ylang/PERFORMANCE.md" \
            "root/usr/share/doc/ylang/SECURITY.md"; do
            if ! grep -Fxq "$expected" build/ylang-yspm/package-files.txt; then
              echo "FAIL: YSPM archive is missing expected entry: $expected" >&2
              cat build/ylang-yspm/package-files.txt >&2
              exit 1
            fi
          done
          for changelog in \
            "root/usr/share/doc/ylang/CHANGELOG-2.2.0.md" \
            "root/usr/share/doc/ylang/CHANGELOG-2.3.0.md"; do
            count="$(grep -Fc "$changelog" build/ylang-yspm/package-files.txt)"
            test "$count" -eq 1
          done
          tar -xzOf "$package_path" metadata.json | python3 -c 'import json,sys; p=json.load(sys.stdin); version=open("VERSION", encoding="utf-8").read().strip(); assert p["name"] == "ylang"; assert p["version"] == version; assert p["architecture"] == "x86_64"; assert p["abi"] == "yspm-abi-1"'
          tar -xzOf "$package_path" root/usr/bin/ylang > build/ylang-packaged-binary
          if ! cmp -s build/ylang-packaged-binary build/ylang; then
            echo "FAIL: packaged compiler bytes differ from the build output." >&2
            sha256sum build/ylang-packaged-binary build/ylang >&2
            exit 1
          fi
          chmod +x build/ylang-packaged-binary
          packaged_version="$(build/ylang-packaged-binary --version)"
          printf '%s\n' "$packaged_version"
          printf '%s\n' "$packaged_version" | grep -Fq "$(tr -d '\r\n' < VERSION)"
      - name: Exercise package install and removal in isolated root
        run: |
          package_path="$(find build/ylang-yspm -name '*.yspkg' -type f -print -quit)"
          YSPM_BIN="$GITHUB_WORKSPACE/tools/yspm-source/build/yspm" bash packaging/yspm/smoke-install.sh "$package_path"

  editor-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Test VS Code diagnostic parser
        run: npm test --prefix editors/vscode
      - name: Package the installable VS Code extension
        working-directory: editors/vscode
        run: |
          mkdir -p ../../artifacts
          npx --yes @vscode/vsce package --out ../../artifacts/ylang-language-support-0.6.0.vsix
      - name: Upload VS Code extension for one-round acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: ylang-vscode-extension-0.6.0
          path: artifacts/ylang-language-support-0.6.0.vsix
          if-no-files-found: error
          retention-days: 7
      - name: Test Neovim diagnostic parser
        run: nvim --headless -u NONE +'luafile editors/nvim/tests/diagnostics.lua'
      - name: Test Neovim syntax highlighting
        run: nvim --headless -u NONE +'luafile editors/nvim/tests/syntax.lua'

  zed-tree-sitter:
    name: Zed Tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tree-sitter CLI (retry transient release-download failures)
        shell: bash
        run: |
          set -Eeuo pipefail
          attempt=1
          max_attempts=5

          while (( attempt <= max_attempts )); do
            echo "Installing tree-sitter-cli@0.27.2 (attempt ${attempt}/${max_attempts})"
            if npm install --global tree-sitter-cli@0.27.2; then
              tree-sitter --version
              exit 0
            fi

            if (( attempt == max_attempts )); then
              break
            fi

            delay=$((attempt * 10))
            echo "::warning::Tree-sitter CLI installation failed; retrying in ${delay}s."
            sleep "${delay}"
            attempt=$((attempt + 1))
          done

          echo "::error::Could not install tree-sitter-cli@0.27.2 after ${max_attempts} attempts."
          exit 1
      - name: Generate and test YLang parser in isolation
        run: python3 tools/check_tree_sitter.py

  website-integrity:
    name: Full bilingual website build and integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-app/package-lock.json
      - name: Build the official homepage
        working-directory: website-app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Set up mdBook
        shell: bash
        run: |
          set -euo pipefail
          version="0.5.4"
          archive="$RUNNER_TEMP/mdbook-${version}.tar.gz"
          install_dir="$RUNNER_TEMP/mdbook"
          mkdir -p "$install_dir"
          url="https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"

          # GitHub Releases can occasionally return transient 502/503/504 responses.
          # Retry the download instead of failing the entire website integrity job.
          curl --fail --location --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 240 \
            "$url" --output "$archive"

          tar -xzf "$archive" -C "$install_dir"
          test -x "$install_dir/mdbook"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/mdbook" --version
      - name: Build, assemble, and validate the complete website
        run: python3 tools/build_website.py site-dist
