name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Build compiler
        run: make clean all CC=${{ matrix.compiler }}
      - name: Run regression tests
        run: make test CC=${{ matrix.compiler }}

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install sanitizer toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer regression suite
        run: make sanitize CC=gcc

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            diffutils
            grep
            sed
      - name: Build compiler for Windows
        run: make clean all CC=gcc
      - name: Run Windows regression tests
        run: make test CC=gcc
      - name: Build from native PowerShell
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./scripts/windows/build.ps1 -Compiler gcc
          ./scripts/windows/smoke-test.ps1
      - name: Set up Node.js for Tree-sitter
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate current Tree-sitter parser
        shell: pwsh
        run: npm install && npm run generate
        working-directory: tree-sitter-ylang
      - name: Build Neovim Tree-sitter parser DLL
        run: gcc -std=c11 -O2 -shared -static-libgcc -Itree-sitter-ylang/src tree-sitter-ylang/src/parser.c -o build/ylang.dll
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/windows/build.ps1",
            "scripts/windows/smoke-test.ps1",
            "editors/neovim/install.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }

  language-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install language server dependencies
        run: npm install
        working-directory: editors/vscode
      - name: Check extension and language server syntax
        run: npm run check
        working-directory: editors/vscode
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package
        working-directory: editors/vscode

  tree-sitter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tree-sitter CLI
        run: npm install
        working-directory: tree-sitter-ylang
      - name: Generate parser
        run: npm run generate
        working-directory: tree-sitter-ylang
      - name: Run grammar corpus tests
        run: npm test
        working-directory: tree-sitter-ylang
      - name: Parse grammar examples
        run: npm run parse:examples
        working-directory: tree-sitter-ylang
      - name: Upload generated Tree-sitter parser sources
        uses: actions/upload-artifact@v4
        with:
          name: ylang-tree-sitter-generated
          path: |
            tree-sitter-ylang/src/parser.c
            tree-sitter-ylang/src/grammar.json
            tree-sitter-ylang/src/node-types.json
          if-no-files-found: error
      - name: Sync generated parser files on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/lsp-foundation'
        run: |
          if git diff --quiet -- tree-sitter-ylang/src/parser.c tree-sitter-ylang/src/grammar.json tree-sitter-ylang/src/node-types.json; then
            echo "Generated parser files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tree-sitter-ylang/src/parser.c tree-sitter-ylang/src/grammar.json tree-sitter-ylang/src/node-types.json
          git commit -m "chore: sync generated Tree-sitter parser"
          git push
