name: Temporary standalone-book visual preview

on:
  push:
    branches: [docs/refresh-book-2.0.0]
    paths:
      - 'docs/book/YLang-Book.pdf'
      - '.github/workflows/preview-book-pdf.yml'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refresh-book-2.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Render sample pages and print a compact contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageDraw
          import base64, fitz
          pdf = fitz.open('docs/book/YLang-Book.pdf')
          chosen = sorted(set([0, 1, 2, min(5, len(pdf)-1)]))
          tiles = []
          for index in chosen:
              pix = pdf[index].get_pixmap(matrix=fitz.Matrix(0.65, 0.65), alpha=False)
              tile = Image.open(BytesIO(pix.tobytes('png'))).convert('RGB')
              tile.thumbnail((280, 400))
              canvas = Image.new('RGB', (300, 430), 'white')
              canvas.paste(tile, ((300-tile.width)//2, 22))
              ImageDraw.Draw(canvas).text((8, 4), f'Page {index+1}', fill='black')
              tiles.append(canvas)
          sheet = Image.new('RGB', (600, 860), '#e9edf0')
          for i, tile in enumerate(tiles):
              sheet.paste(tile, ((i%2)*300, (i//2)*430))
          output = BytesIO()
          sheet.save(output, format='PNG', optimize=True)
          print('PDF_PAGES=' + str(len(pdf)))
          print('PDF_CONTACT_SHEET_BASE64=' + base64.b64encode(output.getvalue()).decode('ascii'))
          PY
